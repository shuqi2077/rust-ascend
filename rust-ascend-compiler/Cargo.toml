[package]
name = "rust-ascend-compiler"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description = "Common Rust kernel IR to Ascend CCE compiler"

[features]
default = ["ascend"]
ascend = []
ptx = ["dep:upstream-compiler"]

[dependencies]
ruda-core.workspace = true
upstream-compiler = { package = "ruda-compiler", git = "https://github.com/shuqi2077/RUDA.git", rev = "dfb315c5d70d99cecc9ea821cdb23b700960eb3c", default-features = false, features = ["ptx"], optional = true }

[[example]]
name = "ascend_ir"
path = "examples/ascend_ir.rs"
required-features = ["ascend"]
