[package]
name = "rust-ascend-compiler"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description = "Common Rust kernel IR to Ascend CCE compiler"

[features]
default = ["ascend"]
ascend = []
ptx = ["dep:upstream-compiler"]

[dependencies]
ruda-core.workspace = true
upstream-compiler = { package = "ruda-compiler", git = "https://github.com/shuqi2077/RUDA.git", rev = "83c0fd21314872b57e56c5ac92d77b299ee41459", default-features = false, features = ["ptx"], optional = true }

[[example]]
name = "ascend_ir"
path = "examples/ascend_ir.rs"
required-features = ["ascend"]
