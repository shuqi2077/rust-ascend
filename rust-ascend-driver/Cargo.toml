[package]
name = "rust-ascend-driver"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description = "Dynamically loaded AscendCL and ACLNN interfaces with native kernel execution"

[features]
default = []
common-ir = ["dep:rust-ascend-compiler", "dep:ruda-core"]
runtime = ["common-ir", "dep:ruda-runtime", "dep:tempfile", "dep:wait-timeout", "dep:ruda-tensor", "dep:rust-ascend-kernels"]

[dependencies]
libloading = "=0.8.9"
sha2 = "=0.10.9"
rust-ascend-compiler = { workspace = true, features = ["ascend"], optional = true }
rust-ascend-kernels = { workspace = true, optional = true }
ruda-core = { workspace = true, optional = true }
ruda-runtime = { git = "https://github.com/shuqi2077/RUDA.git", rev = "40d0ddfa89aaf27790bfac3db7436a22312c9bf8", optional = true }
tempfile = { version = "3", optional = true }
wait-timeout = { version = "0.2", optional = true }
ruda-tensor = { git = "https://github.com/shuqi2077/RUDA.git", rev = "40d0ddfa89aaf27790bfac3db7436a22312c9bf8", default-features = false, optional = true }

[[example]]
name = "common_ir_validate"
path = "examples/common_ir_validate.rs"
required-features = ["common-ir"]

[[example]]
name = "common_rows_validate"
path = "examples/common_rows_validate.rs"
required-features = ["common-ir"]
